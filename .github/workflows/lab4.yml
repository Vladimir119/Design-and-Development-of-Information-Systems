name: Lab 4
on:
  push:
    branches: [lab4]
    paths:
      - 'lab4/**'
      - '!lab4/screenshots/**'
      - '!lab4/README.md'
      - '.github/workflows/lab4.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: bash lab4/check.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab4-check
          path: lab4/screenshots/
