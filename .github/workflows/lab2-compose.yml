name: Lab 2.2
on:
  push:
    branches: [lab2-compose]
    paths:
      - 'lab2/compose/**'
      - '!lab2/compose/screenshots/**'
      - '!lab2/compose/README.md'
      - '.github/workflows/lab2-compose.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: bash lab2/compose/check.sh
      - uses: actions/upload-artifact@v4
        with:
          name: lab2-compose-screenshots
          path: lab2/compose/screenshots/
